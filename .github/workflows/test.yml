name: Test Composer runner controller

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate production controller contract
        run: python scripts/validate_controller.py
      - name: Run controller tests
        run: python -m unittest discover -s tests -v
